name: Sira Medical
description: >-
  Sira Medical develops augmented reality software that transforms 3D radiological
  imaging into patient-specific holographic models projected onto real-world backgrounds.
  Delivered through head-mounted AR devices (such as Microsoft HoloLens) and mobile
  platforms, the technology helps surgeons perform preoperative planning with greater
  confidence, clinicians educate patients with understandable visualizations, medical
  schools train students on patient-specific anatomy, and medical-device makers design
  and validate implants. The company is backed by 500 Global, Eileses Capital, UCSF
  Innovation Ventures, and Microsoft for Startups. Sira Medical operates as a clinical
  AR software vendor and does not currently expose a public developer API, SDK, or
  developer portal; this profile captures its public identity, legal, and domain-security
  posture for the API Evangelist network.
